<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jensen Decors - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: url('https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&q=80&w=1600') center/cover;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
        }

        .login-grid {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: rgba(15, 15, 15, 0.9);
            width: 800px; /* Thoda width barhaya hai spacing ke liye */
            min-height: 450px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* --- CLOSE BUTTON --- */
        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #fff;
            font-size: 24px;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
            z-index: 10;
        }

        .close-btn:hover {
            color: #b58d48;
            transform: scale(1.2);
        }

        .logo-box {
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.02);
        }

        .logo-box img {
            width: 120%; /* Logo size adjust kiya */
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }

        .form-box {
            padding: 60px 40px;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h2 {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            letter-spacing: 3px;
            margin-bottom: 30px;
            border-left: 4px solid #b58d48;
            padding-left: 15px;
        }

        .input-item {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            outline: none;
            font-size: 12px;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #b58d48;
            background: rgba(255, 255, 255, 0.1);
        }

        .action-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }

        .btn-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn {
            background: #b58d48;
            color: #000;
            border: none;
            padding: 12px 35px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn:hover {
            background: #fff;
            transform: translateY(-2px);
        }

        .link {
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .link:hover {
            color: #b58d48;
        }

        .footer-links {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 15px;
        }

        /* Mobile layout */
        @media (max-width: 768px) {
            .login-grid {
                grid-template-columns: 1fr;
                width: 90%;
                margin: 20px;
            }

            .logo-box {
                display: none; /* Mobile par logo hide kar diya taake form saaf dikhe */
            }

            .form-box {
                padding: 40px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="login-grid">
        <!-- Close Button -->
        <a href="HOME.html" class="close-btn">&times;</a>

        <!-- Grid Box 1: Logo -->
        <div class="logo-box">
            <img src="https://jensendecors.netlify.app/J__1_-removebg-preview.png" alt="JD Logo">
        </div>

        <!-- Grid Box 2: Form -->
        <div class="form-box">
            <h2>SIGN IN</h2>
            <form>
                <div class="input-item">
                    <input type="text" placeholder="USER NAME OR EMAIL" required>
                </div>
                <div class="input-item">
                    <input type="password" placeholder="PASSWORD" required>
                </div>
                
                <div class="action-area">
                    <div class="btn-row">
                        <button type="submit" class="btn">LOGIN</button>
                        <a href="#" class="link">Forgot Password?</a>
                    </div>
                </div>

                <div class="footer-links">
                    <a href="#" class="link">Don't have an account?</a>
                    <a href="contact.html" class="link" style="color:#b58d48; font-weight:bold;">Create Now</a>
                </div>
            </form>
        </div>
    </div>

</body>

</html>
